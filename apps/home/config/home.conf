# AXS Home layout. One entry per line, fields separated by |
#
#   app|<label>|<package>
#       App tile, in default order (empty label = the app's own name).
#       Reorder on the TV: long-press OK, move with the D-pad, OK to drop.
#   input|<label>|<port>|<tv input id>|<icon>|<#rrggbb>
#       Sidebar entry. Empty label = only the port is shown.
#       icon: gamepad, hdmi or av (empty = hdmi for HDMI ports, av otherwise).
#   menu|<label>|action|<intent action>
#   menu|<label>|app|<package>
#   menu|<label>|allapps
#   menu|<label>|resetorder
#       Items in the menu (top right, or the remote's MENU key).
#   wallpaper|waves|<#top colour>|<#wave colour>
#
# Edit, then run: SKIP_BUILD=1 sh changes/1-fast-home/apply.sh
# Input ids: scripts/tv.sh shell 'dumpsys tv_input' | grep TvInputInfo

