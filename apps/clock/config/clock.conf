# AXS Clock screensaver. Built into the APK: edit, then re-run
# changes/33-market-panel/apply.sh.
#
# clock|<time format>|<date format>   (java.text.SimpleDateFormat patterns)
#   24-hour: HH:mm        12-hour with AM/PM: h:mm a
clock|HH:mm|EEEE, d MMMM yyyy

# background|waves   animated, same designs as AXS Home: waves, orbit, pop, bloom;
#                    dimmed behind the text. background|black for plain black.
background|waves

# weather|auto   uses the TV's approximate location (Android network location,
#                rounded to about 1 km). A city set as weather_city in .env is
#                the fallback; it is pushed to the TV only, never committed.
# weather|off    hides the weather line.
weather|auto

# ticker|<label>|<source>|<symbol>[|invert]
#   ecb        ECB daily reference rates via Frankfurter, base USD (IDR, EUR, JPY, GBP, ...)
#              invert shows 1/rate, e.g. EUR/USD from the USD→EUR rate
#   goldprice  goldprice.dev spot, 15 min delayed (XAU, XAG)
#   coingecko  CoinGecko id (bitcoin, ethereum, solana, ...)
# Up to 8 are shown, in this order.
ticker|USD/IDR|ecb|IDR
ticker|EUR/USD|ecb|EUR|invert
ticker|GBP/USD|ecb|GBP|invert
ticker|USD/JPY|ecb|JPY
ticker|XAU/USD|goldprice|XAU
ticker|BTC/USD|coingecko|bitcoin
ticker|ETH/USD|coingecko|ethereum
ticker|SOL/USD|coingecko|solana
